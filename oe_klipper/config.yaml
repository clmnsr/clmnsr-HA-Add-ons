name: "OctoEverywhere for Klipper"
version: "2.0"
slug: "oe_klipper"
description: "OctoEverywhere for Klipper, also for modded Klipper like OpenCreator or ZMOD"
arch:
  - aarch64
  - amd64
init: false
host_network: true
map:
  - data:rw
environment:
  COMPANION_MODE: "klipper"
  MOONRAKER_PORT: "7125"
  WEBSERVER_PORT: "80"
options:
  printer_ip: "192.168.1.254"
  reset_pairing: false
schema:
  printer_ip: str
  reset_pairing: bool